<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDD/SSD 取り出しプロンプト生成</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@300;400;500&display=swap');
  :root {
    --bg: #111111; --surface: #222222; --border: #404040;
    --accent: #e8ff47; --accent2: #ff6b35; --text: #f5f5f5;
    --muted: #aaaaaa; --success: #4ade80; --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans JP', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 16px;
  }
  .container { width: 100%; max-width: 480px; }
  .header { margin-bottom: 32px; }
  .label-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    font-weight: 600; letter-spacing: 0.2em; color: var(--accent);
    text-transform: uppercase; border: 1px solid var(--accent);
    display: inline-block; padding: 3px 8px; margin-bottom: 12px;
  }
  h1 { font-size: 22px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { margin-top: 6px; font-size: 13px; color: var(--muted); font-weight: 300; }
  .section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.1em; margin-bottom: 8px; display: block;
  }
  .chips-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 6px 12px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.05); }
  .toggle-row { margin-bottom: 20px; }
  .toggle-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 6px 12px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em;
  }
  .toggle-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.05); }
  .input-block { margin-bottom: 20px; }
  .input-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: 0.1em; margin-bottom: 8px; display: block;
  }
  .input-row { display: flex; gap: 0; }
  input[type="text"] {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-right: none; color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 16px;
    padding: 14px 16px; outline: none; transition: border-color 0.2s;
    -webkit-appearance: none; border-radius: 0;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: #666; }
  .mic-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; padding: 0 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .mic-btn:hover { color: var(--text); border-color: var(--muted); }
  .mic-btn.recording { color: var(--danger); border-color: var(--danger); background: rgba(248,113,113,0.1); animation: pulse 1s infinite; }
  .mic-btn.disabled { color: #444; cursor: not-allowed; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .mic-status {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted); margin-top: 6px; min-height: 16px; letter-spacing: 0.05em;
  }
  .mic-status.recording { color: var(--danger); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .preview-block {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent2); padding: 16px; margin-bottom: 16px;
    min-height: 120px; transition: all 0.2s;
  }
  .preview-block.has-content { border-left-color: var(--accent); }
  .preview-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 10px;
  }
  .preview-text { font-size: 14px; line-height: 1.7; color: var(--muted); font-style: italic; white-space: pre-wrap; word-break: break-word; }
  .preview-text.filled { color: var(--text); font-style: normal; }
  .btn-copy {
    width: 100%; background: var(--accent); color: #0f0f0f; border: none;
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600;
    padding: 16px; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .btn-copy:active { transform: scale(0.98); background: #d4eb3a; }
  .btn-copy:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
  .btn-copy.copied { background: var(--success); }
  .footer { margin-top: 24px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #444; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="label-tag">TOOL v1.3</div>
    <h1>HDD/SSD<br><span>取り出しプロンプト</span>生成</h1>
    <p class="sub">メーカー選択 → モデル名入力 → コピー</p>
  </div>

  <span class="section-label">MAKER</span>
  <div class="chips-row" id="makerRow">
    <button class="chip" data-maker="Dell">Dell</button>
    <button class="chip" data-maker="HP">HP</button>
    <button class="chip" data-maker="Lenovo">Lenovo</button>
    <button class="chip" data-maker="Fujitsu">Fujitsu</button>
    <button class="chip" data-maker="Panasonic">Panasonic</button>
    <button class="chip" data-maker="NEC">NEC</button>
    <button class="chip" data-maker="Toshiba">Toshiba</button>
    <button class="chip" data-maker="Apple">Apple</button>
    <button class="chip" data-maker="ASUS">ASUS</button>
    <button class="chip" data-maker="Acer">Acer</button>
  </div>

  <div class="input-block">
    <span class="input-label">MODEL NAME</span>
    <div class="input-row">
      <input type="text" id="modelInput" placeholder="例: Inspiron 15 3511" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="mic-btn" id="micBtn" title="音声入力">
        <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="mic-status" id="micStatus"></div>
  </div>

  <span class="section-label">DRIVE TYPE</span>
  <div class="chips-row" id="driveRow">
    <button class="chip active" data-val="HDD/SSD">HDD/SSD</button>
    <button class="chip" data-val="HDD">HDD のみ</button>
    <button class="chip" data-val="SSD">SSD のみ</button>
    <button class="chip" data-val="M.2 SSD">M.2 SSD</button>
  </div>

  <span class="section-label">OPTIONS</span>
  <div class="toggle-row">
    <button class="toggle-btn" id="ifixitToggle">iFixit URL を含める</button>
  </div>

  <hr class="divider">

  <div class="preview-block" id="previewBlock">
    <div class="preview-label">GENERATED PROMPT</div>
    <div class="preview-text" id="previewText">メーカーを選択してモデル名を入力してください</div>
  </div>

  <button class="btn-copy" id="copyBtn" disabled>コピー</button>
  <div class="footer">TAP TO COPY → PASTE TO AI</div>
</div>

<script>
  const modelInput   = document.getElementById('modelInput');
  const previewText  = document.getElementById('previewText');
  const previewBlock = document.getElementById('previewBlock');
  const copyBtn      = document.getElementById('copyBtn');
  const ifixitToggle = document.getElementById('ifixitToggle');
  const makerRow     = document.getElementById('makerRow');
  const driveRow     = document.getElementById('driveRow');
  const micBtn       = document.getElementById('micBtn');
  const micStatus    = document.getElementById('micStatus');

  let selectedMaker  = '';
  let selectedType   = 'HDD/SSD';
  let includeIfixit  = false;
  let currentPrompt  = '';
  let recognition    = null;
  let isRecording    = false;

  // ── Maker chips ───────────────────────────────────
  makerRow.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    if (selectedMaker === chip.dataset.maker) {
      chip.classList.remove('active');
      selectedMaker = '';
    } else {
      makerRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedMaker = chip.dataset.maker;
    }
    update();
  });

  // ── Drive type chips ──────────────────────────────
  driveRow.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    driveRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedType = chip.dataset.val;
    update();
  });

  // ── iFixit toggle ─────────────────────────────────
  ifixitToggle.addEventListener('click', () => {
    includeIfixit = !includeIfixit;
    ifixitToggle.classList.toggle('active', includeIfixit);
    update();
  });

  // ── Input ─────────────────────────────────────────
  modelInput.addEventListener('input', update);

  // ── Voice input ───────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.classList.add('disabled');
    micStatus.textContent = '音声入力はこのブラウザでは未対応です';
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      micStatus.classList.add('recording');
      micStatus.textContent = '● 録音中… 話しかけてください';
    };

    recognition.onresult = e => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }
      modelInput.value = final || interim;
      update();
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      micStatus.classList.remove('recording');
      micStatus.textContent = modelInput.value ? '✓ 入力完了' : '';
    };

    recognition.onerror = e => {
      isRecording = false;
      micBtn.classList.remove('recording');
      micStatus.classList.remove('recording');
      micStatus.textContent = 'エラー: ' + (e.error === 'not-allowed' ? 'マイクの許可が必要です' : e.error);
    };

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        recognition.stop();
      } else {
        modelInput.value = '';
        micStatus.textContent = '';
        recognition.start();
      }
    });
  }

  // ── Generate ──────────────────────────────────────
  function generatePrompt(maker, model, type) {
    const modelTrimmed = model.trim();
    if (!modelTrimmed) return '';
    const fullName = maker ? maker + ' ' + modelTrimmed : modelTrimmed;
    let prompt = fullName + ' の ' + type + ' 取り出し手順を教えてください。以下を箇条書き・各項目2〜3行以内で簡潔にまとめてください：\n' +
      '・HDD/SSDスロットの個数と場所（複数ある場合はすべて記載）\n' +
      '・必要な工具（ドライバーの種類・サイズ）\n' +
      '・手順（ネジの本数・位置を含む）\n' +
      '・注意点・よくある失敗\n' +
      '・作業時間の目安';
    if (includeIfixit) {
      prompt += '\n・iFixitの参考ページURLがあれば1件だけ教えてください';
    }
    return prompt;
  }

  function update() {
    currentPrompt = generatePrompt(selectedMaker, modelInput.value, selectedType);
    if (currentPrompt) {
      previewText.textContent = currentPrompt;
      previewText.classList.add('filled');
      previewBlock.classList.add('has-content');
      copyBtn.disabled = false;
    } else {
      previewText.textContent = 'メーカーを選択してモデル名を入力してください';
      previewText.classList.remove('filled');
      previewBlock.classList.remove('has-content');
      copyBtn.disabled = true;
    }
  }

  // ── Copy ──────────────────────────────────────────
  copyBtn.addEventListener('click', () => {
    if (!currentPrompt) return;
    const done = () => {
      copyBtn.textContent = 'コピーしました ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'コピー'; copyBtn.classList.remove('copied'); }, 2000);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(currentPrompt).then(done).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = currentPrompt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }
  });
</script>
</body>
</html>
